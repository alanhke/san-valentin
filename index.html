<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>¿Quieres ser mi San Valentín? 💕</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: fadeIn 1.2s ease;
            z-index: 2;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            margin-top: 1rem;
        }

        button {
            border: none;
            padding: 0.8rem 1.6rem;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yesBtn {
            background: #fff;
            color: #ff4d6d;
            font-weight: bold;
            transform: scale(1);
        }

        #noBtn {
            background: transparent;
            color: white;
            border: 2px solid white;
        }

        #response {
            margin-top: 1.5rem;
            font-size: 1.4rem;
            display: none;
        }

        .confetti {
            position: fixed;
            top: -20vh;
            width: 10px;
            height: 10px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .heart {
            position: fixed;
            top: -25vh;
            font-size: 20px;
            animation: fall linear forwards;
            pointer-events: none;
        }


        #loveGif {
            margin-top: 1rem;
            width: 200px;
            display: none;           /* oculto al inicio */
            margin-left: auto;       /* centrado horizontal */
            margin-right: auto;
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            from {
                transform: scale(0.7);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>💘 Oye mi amor 💘</h1>

        <p>
            No sé cómo decirlo de otra forma,<br>
            así que lo haré directo…
        </p>

        <h2>¿Quieres ser mi San Valentín? 🌹</h2>

        <div class="buttons">
            <button id="yesBtn" onclick="sayYes()">Sí 💖</button>
            <button id="noBtn" onclick="sayNo()">No 🙈</button>
        </div>

        <div id="response"></div>
        <img id="loveGif" src="love2.gif" alt="celebración">
    </div>

    <audio id="yaySound">
        <source src="Futile_Devices.mp3" type="audio/mpeg">
    </audio>

    <script>
        let scale = 1;
        let noCount = 0;

        function sayNo() {
            scale += 0.15;
            document.getElementById("yesBtn").style.transform = `scale(${scale})`;
            noCount++;
            const mensaje = [   "¿Segura? 🤔",
                                "¿Segura segura? 😅",
                                "¿Segurita? 🥺",
                                "¿Muy segura? 😳",
                                "Piénsalo bien… 😏",
                                "Ya sabes cuál es la correcta 💖"];
            const r = document.getElementById("response");
            r.style.display = "block";
            if (noCount <= mensaje.length) {
                r.innerHTML = mensaje[noCount - 1];
            }else {
                r.innerHTML = "Ya en serio, dime que sí 🥺";
            }
            
        }

        function sayYes() {
            const r = document.getElementById("response");
            r.style.display = "block";
            r.innerHTML = "🥰 ¡SÍII! Sabía que dirías que sí 💕";

            document.getElementById("loveGif").style.display = "block";

            document.getElementById("yaySound").play();
            document.getElementById("yaySound").volume = 0.2;
            document.getElementById("yesBtn").style.transform = "scale(1)";
            scale = 1;
            startLoveRain();
        }

        function launchConfetti() {
            for (let i = 0; i < 180; i++) {
                const confetti = document.createElement("div");
                confetti.classList.add("confetti");
                confetti.style.left = Math.random() * 100 + "vw";
                confetti.style.top = (-Math.random() * 30 - 10) + "vh";
                confetti.style.backgroundColor = randomColor();
                confetti.style.animationDuration = (Math.random() * 3 + 4) + "s";
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 4000);
            }
        }

        function launchHearts() {
            for (let i = 0; i < 100; i++) {
                const heart = document.createElement("div");
                heart.classList.add("heart");
                const hearts = ["❤️", "💖", "💘", "💕"];
                heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];

                heart.style.left = Math.random() * 100 + "vw";
                heart.style.top = (-Math.random() * 40 - 10) + "vh";
                heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
                heart.style.fontSize = (Math.random() * 10 + 16) + "px";

                document.body.appendChild(heart);

                setTimeout(() => heart.remove(), 5000);
            }
        }

        function randomColor() {
            const colors = ["#ff4d6d", "#ffd166", "#fff", "#cdb4db"];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function startLoveRain() {
            launchConfetti();
            launchHearts();

            setTimeout(startLoveRain, 800);
        }
    </script>

</body>
</html>
